services:
  watchradar:
    build: .
    container_name: watchradar
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      - TZ=${TZ:-UTC}
      - TMDB_API_KEY=${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      # Set to true when a reverse proxy (nginx/caddy/traefik) sits in front.
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - SESSION_DAYS=${SESSION_DAYS:-90}
      - REFRESH_INTERVAL_MINUTES=${REFRESH_INTERVAL_MINUTES:-360}
      - REFRESH_BATCH=${REFRESH_BATCH:-40}
      - LEGACY_DB=${LEGACY_DB:-}
